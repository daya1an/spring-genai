# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=8080
#server.servlet.context-path=/api

# ============================================
# APPLICATION CONFIGURATION
# ============================================
spring.application.name=Spring Boot Enterprise Gen AI
spring.profiles.active=dev

# ============================================
# GOOGLE GEMINI CONFIGURATION
# ============================================
spring.ai.google.genai.api-key=${GOOGLE_GEMINI_API_KEY:<your-api-key-here>}

# Model Configuration
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.chat.options.temperature=0.7
spring.ai.google.genai.chat.options.max-output-tokens=1000
spring.ai.google.genai.chat.options.top-p=0.95
spring.ai.google.genai.chat.options.top-k=40

# Safety Settings
spring.ai.google.genai.chat.options.safety-settings[0].category=HARM_CATEGORY_HARASSMENT
spring.ai.google.genai.chat.options.safety-settings[0].threshold=BLOCK_NONE
spring.ai.google.genai.chat.options.safety-settings[1].category=HARM_CATEGORY_HATE_SPEECH
spring.ai.google.genai.chat.options.safety-settings[1].threshold=BLOCK_NONE
spring.ai.google.genai.chat.options.safety-settings[2].category=HARM_CATEGORY_SEXUALLY_EXPLICIT
spring.ai.google.genai.chat.options.safety-settings[2].threshold=BLOCK_NONE
spring.ai.google.genai.chat.options.safety-settings[3].category=HARM_CATEGORY_DANGEROUS_CONTENT
spring.ai.google.genai.chat.options.safety-settings[3].threshold=BLOCK_NONE

# Embedding Configuration
spring.ai.google.genai.embedding.text.options.model=text-embedding-004

# ============================================
# DATABASE CONFIGURATION
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/genai_db
spring.datasource.username=username
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ============================================
# REDIS CONFIGURATION (CACHING)
# ============================================
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=60000
spring.cache.type=REDIS
spring.cache.redis.time-to-live=3600000
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=genai:

# ============================================
# SECURITY CONFIGURATION
# ============================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8888
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8888/.well-known/jwks.json

# ============================================
# ACTUATOR & MONITORING CONFIGURATION
# ============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.export.prometheus.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.root=INFO
logging.level.com.genai=DEBUG
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.security=DEBUG
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================
# RESILIENCE4J CONFIGURATION
# ============================================
# Circuit Breaker
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.gemini-api.failureRateThreshold=50
resilience4j.circuitbreaker.instances.gemini-api.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.gemini-api.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.gemini-api.slowCallRateThreshold=50
resilience4j.circuitbreaker.instances.gemini-api.slowCallDurationThreshold=2s

# Retry
resilience4j.retry.instances.gemini-retry.maxAttempts=3
resilience4j.retry.instances.gemini-retry.waitDuration=500ms

# Time Limiter
resilience4j.timelimiter.instances.gemini-timelimit.timeoutDuration=1000s
resilience4j.timelimiter.instances.gemini-timelimit.cancelRunningFuture=true

# ============================================
# APPLICATION CUSTOM CONFIGURATION
# ============================================
app.ai.request.timeout=30
app.api.rate-limit.requests=100
app.api.rate-limit.duration-minutes=1
app.security.jwt.secret=${JWT_SECRET:your-super-secret-jwt-key-change-in-production}
app.security.jwt.expiration=3600000
app.audit.enabled=true
app.validation.enable-sanitization=true

# ============================================
# JSON FORMATTING
# ============================================
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null