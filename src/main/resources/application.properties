spring.application.name=spring-genai

# Server Configuration
server.port=8080
#server.servlet.context-path=/api

# Google Gemini Configuration (Spring AI 1.0+)
spring.ai.google.genai.api-key=${GOOGLE_GEMINI_API_KEY:<YOUR_API_KEY_HERE>}

# Model Configuration
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.chat.options.temperature=0.7
spring.ai.google.genai.chat.options.max-output-tokens=1000
spring.ai.google.genai.chat.options.top-p=0.95
spring.ai.google.genai.chat.options.top-k=40

# Safety Settings (Optional - customize as needed)
spring.ai.google.genai.chat.options.safety-settings[0].category=HARM_CATEGORY_HARASSMENT
spring.ai.google.genai.chat.options.safety-settings[0].threshold=BLOCK_NONE
spring.ai.google.genai.chat.options.safety-settings[1].category=HARM_CATEGORY_HATE_SPEECH
spring.ai.google.genai.chat.options.safety-settings[1].threshold=BLOCK_NONE
spring.ai.google.genai.chat.options.safety-settings[2].category=HARM_CATEGORY_SEXUALLY_EXPLICIT
spring.ai.google.genai.chat.options.safety-settings[2].threshold=BLOCK_NONE
spring.ai.google.genai.chat.options.safety-settings[3].category=HARM_CATEGORY_DANGEROUS_CONTENT
spring.ai.google.genai.chat.options.safety-settings[3].threshold=BLOCK_NONE

# Embedding Configuration
#spring.ai.google.genai.embedding.options.model=text-embedding-004
spring.ai.google.genai.embedding.text.options.model=text-embedding-004

# Request Timeout (in seconds)
app.ai.request.timeout=30

# Logging
logging.level.root=INFO
logging.level.com.genai=DEBUG
logging.level.org.springframework.ai=DEBUG

# JSON Pretty Print
spring.jackson.serialization.indent-output=true

# Actuator Configuration (optional)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always